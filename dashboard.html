<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <title>V. Caetano | Executive Dashboard</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/
bootstrap.min.css" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 <style>
 body { background: #020617; color: #f8fafc; font-family: 
'Inter', sans-serif; }
 .card-pro { background: #0f172a; border: 1px solid #38bdf8;border-radius: 10px; padding: 20px; }
  .accent { color: #38bdf8; font-weight: bold; }
  </style>
 </head>
 <body>
  <div class="container py-5">
  <h1 class="mb-4">CORE <span class="accent">STRATEGY</span></h1>
  <div class="row g-4">
  <div class="col-md-8">
  <div class="card-pro">
  <h5>Market Momentum</h5>
  <canvas id="myChart"></canvas>
  </div>
  </div>
  <div class="col-md-4">
  <div class="card-pro">
  <h5>ROI Calculator</h5>
  <input id="inv" type="number" class="form-control 
 mb-2" placeholder="Investimento">
  <input id="ret" type="number" class="form-control 
 mb-2" placeholder="Retorno">
  <button class="btn btn-info w-100" 
 onclick="alert('ROI: '+((ret.value-inv.value)/
 inv.value*100)+'%')">Calcular</button>
  </div>
  </div>
  </div>
  </div>
 </body>
 </html>
