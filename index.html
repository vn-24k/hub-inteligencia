<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H.I.E - Hub de Inteligência</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { border-color: #38bdf8; }
        .status-online { color: #10b981; font-weight: bold; }
        header { border-bottom: 2px solid #38bdf8; }
        .badge-custom { background-color: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <header class="pb-3 mb-5 d-flex justify-content-between align-items-center">
            <span class="fs-3 fw-bold">🚀 Hub de Inteligência <span style="color: #38bdf8;">Estratégica</span></span>
            <span class="badge badge-custom">Mobile Dev Mode</span>
        </header>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="p-4 card rounded-4 shadow-sm">
                    <h4 class="mb-4 text-info">Monitor de Automação</h4>
                    <div id="dados-ia">
                        <div class="spinner-border text-info" role="status"></div>
                        <p class="mt-2">Sincronizando com Pydroid 3...</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="p-4 card rounded-4 shadow-sm">
                    <h4 class="mb-4 text-info">Insights do Sistema</h4>
                    <p id="insight-texto" class="lead">O processamento de dados está sendo gerenciado via terminal.</p>
                    <hr class="text-secondary">
                    <small class="text-secondary">Conectado via: <strong>Termux/Android</strong></small>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function carregarDados() {
            try {
                const response = await fetch('dados_ia.json');
                const data = await response.json();
                
                document.getElementById('dados-ia').innerHTML = `
                    <p>Status: <span class="status-online">● ${data.status}</span></p>
                    <p class="mb-1"><strong>Tendência:</strong></p>
                    <div class="p-2 bg-dark rounded text-info mb-3">${data.tendencia_do_dia}</div>
                    <p class="small text-secondary">Atualizado em: ${data.ultima_atualizacao}</p>
                `;
                
                document.getElementById('insight-texto').innerText = data.alerta;
            } catch (err) {
                document.getElementById('dados-ia').innerHTML = `
                    <div class="alert alert-warning">Aguardando arquivo dados_ia.json...</div>
                `;
            }
        }

        // Executa ao carregar a página
        carregarDados();
    </script>
</body>
</html>
