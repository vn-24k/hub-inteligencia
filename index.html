<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINICIUS CAETANO | STRATEGIC HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; border-radius: 12px; backdrop-filter: blur(8px); }
        .accent { color: #38bdf8; }
        .btn-cmd { border: 1px solid #38bdf8; color: #38bdf8; background: transparent; transition: 0.3s; }
        .btn-cmd:hover { background: #38bdf8; color: #020617; box-shadow: 0 0 15px #38bdf8; }
        .status-bar { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-0">CORE <span class="accent">COMMAND</span></h4>
                <div class="status-bar accent">● System Online | Brazil/SP</div>
            </div>
            <div id="relogio" class="h4 fw-light">00:00:00</div>
        </header>

        <div class="row g-4">
            <div class="col-md-7">
                <div class="glass p-4 h-100">
                    <h6 class="text-secondary mb-3">CONTEÚDO E ESTRATÉGIA</h6>
                    <div id="dados-ia">
                        <h2 id="tendencia">Sincronizando...</h2>
                        <p id="insight" class="text-secondary lead small font-monospace"></p>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex gap-2">
                        <button class="btn btn-cmd btn-sm" onclick="alert('Gerando Roteiro...')">GERAR ROTEIRO IA</button>
                        <button class="btn btn-cmd btn-sm" onclick="calcEngajamento()">CALCULAR ENGAGEMENT</button>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="glass p-4">
                    <h6 class="text-secondary mb-3">ROI CALCULATOR</h6>
                    <input type="number" id="views" class="form-control bg-dark text-white border-secondary mb-2" placeholder="Visualizações">
                    <input type="number" id="cliques" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Cliques/Vendas">
                    <button class="btn btn-info w-100" onclick="alert('Taxa de Conversão: ' + ((document.getElementById('cliques').value / document.getElementById('views').value) * 100).toFixed(2) + '%')">ANALISAR PERFORMANCE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        async function loadData() {
            const res = await fetch(`dados_ia.json?v=${Math.random()}`);
            const data = await res.json();
            document.getElementById('tendencia').innerText = data.tendencia_do_dia;
            document.getElementById('insight').innerText = "LOG_DATA: " + data.alerta;
        }
        loadData();
    </script>
</body>
</html>
