<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Ops | Silva & Kannika</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        .zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* Bandeiras com overlay escuro para leitura */
        .br { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg') center/cover; }
        .th { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)), url('https://upload.wikimedia.org/wikipedia/commons/a/a9/Flag_of_Thailand.svg') center/cover; }

        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); padding: 30px; border-radius: 4px; text-align: center; width: 85%; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .br-border { border-top: 4px solid #00ff88; }
        .th-border { border-top: 4px solid #ff2a2a; }

        .person { font-size: 1.4rem; letter-spacing: 4px; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .clock { font-size: 4rem; font-family: 'Courier New', monospace; font-weight: 700; margin: 10px 0; }
        .clock span { font-size: 2rem; opacity: 0.3; }
        .temp { background: rgba(255,255,255,0.1); padding: 4px 15px; border-radius: 2px; font-size: 0.8rem; letter-spacing: 2px; }
        
        .subtle-footer { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 3px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="zone br">
            <div class="glass br-border">
                <div class="person">Vinícius Silva</div>
                <div class="clock" id="br-t">00:00<span>:00</span></div>
                <div class="temp" id="br-temp">--°C</div>
            </div>
        </div>
        <div class="zone th">
            <div class="glass th-border">
                <div class="person">Tawan Kannika</div>
                <div class="clock" id="th-t">00:00<span>:00</span></div>
                <div class="temp" id="th-temp">--°C</div>
            </div>
        </div>
    </div>
    <div class="subtle-footer">Telemetria Sincronizada</div>

    <script>
        let data = {};
        async function sync() {
            const r = await fetch(`dados_ia.json?v=${Date.now()}`);
            data = await r.json();
            document.getElementById('br-temp').innerText = data.brasil.temp;
            document.getElementById('th-temp').innerText = data.tailandia.temp;
        }
        function update() {
            const now = new Date();
            const f = (tz, id) => {
                const s = now.toLocaleTimeString('pt-BR', {timeZone: tz, hour12: false});
                const [h, m, sec] = s.split(':');
                document.getElementById(id).innerHTML = `${h}:${m}<span>:${sec}</span>`;
            };
            if(data.brasil) f(data.brasil.timeZone, 'br-t');
            if(data.tailandia) f(data.tailandia.timeZone, 'th-t');
        }
        setInterval(update, 1000);
        sync();
    </script>
</body>
</html>
