<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronização Global</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Inter', sans-serif; }
        .card-zone { background: #1e1e1e; border-radius: 15px; padding: 30px; text-align: center; height: 100%; border-top: 3px solid #555; }
        .br-zone { border-color: #009c3b; }
        .th-zone { border-color: #ce1126; }
        .time-display { font-size: 3.5rem; font-weight: 700; margin: 15px 0; letter-spacing: -2px; }
        .temp-badge { background: #333; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }
        .msg-box { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h4 class="text-center mb-5 text-secondary text-uppercase tracking-widest">Dual-Zone Telemetry</h4>
        
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card-zone br-zone">
                    <h6 class="text-secondary text-uppercase" id="br-city">--</h6>
                    <div class="time-display" id="br-time">--:--</div>
                    <span class="temp-badge" id="br-temp">--°C</span>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card-zone th-zone">
                    <h6 class="text-secondary text-uppercase" id="th-city">--</h6>
                    <div class="time-display" id="th-time">--:--</div>
                    <span class="temp-badge" id="th-temp">--°C</span>
                </div>
            </div>
        </div>

        <div class="msg-box">
            <h5 class="fw-light mb-1" id="msg-pt">Conectando...</h5>
            <p class="text-secondary mb-0" id="msg-th" style="font-size: 1.1rem;"></p>
        </div>
        <div class="text-center mt-4">
            <small class="text-muted" id="update-time">Sync: --</small>
        </div>
    </div>

    <script>
        async function fetchSyncData() {
            try {
                const res = await fetch(`dados_ia.json?v=${Math.random()}`);
                const data = await res.json();
                
                document.getElementById('br-city').innerText = data.brasil.cidade;
                document.getElementById('br-time').innerText = data.brasil.horario;
                document.getElementById('br-temp').innerText = data.brasil.temperatura;

                document.getElementById('th-city').innerText = data.tailandia.cidade;
                document.getElementById('th-time').innerText = data.tailandia.horario;
                document.getElementById('th-temp').innerText = data.tailandia.temperatura;

                document.getElementById('msg-pt').innerText = data.comunicacao.pt;
                document.getElementById('msg-th').innerText = data.comunicacao.th;
                
                document.getElementById('update-time').innerText = "Última sincronização: " + data.ultima_atualizacao;
            } catch (e) {
                console.error("Erro na leitura de dados");
            }
        }
        fetchSyncData();
    </script>
</body>
</html>
